<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f6f2">
<meta name="description" content="Fitness Guide">
<link rel="manifest" href="manifest.json">
<title>Fitness Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="module-css" rel="stylesheet" href="module-01.css?v=6">
</head>
<body>
<div id="module-root"></div>
<script>
(function(){
  const p=new URLSearchParams(location.search);
  const module=p.get('module')==='2'?'2':'1';
  const root=document.querySelector('#module-root');
  if(module==='2'){
    root.id='module-02';
    document.title='Fitness Guide · Today';
    document.querySelector('#module-css').href='module-02.css?v=6';
    const s=document.createElement('script');s.src='module-02.js?v=6';document.body.appendChild(s);
  }else{
    root.id='module-01';
    const s=document.createElement('script');s.src='module-01.js?v=6';document.body.appendChild(s);
  }
})();
</script>
<script>
if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())).catch(()=>{});if(window.caches)caches.keys().then(keys=>keys.forEach(k=>caches.delete(k))).catch(()=>{});}
</script>
</body>
</html>
